[build]
  command = "pip install -r requirements.txt"
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[context.production.environment]
  SITE_BASE_URL = "https://goforaibusiness.netlify.app"
  PUBLIC_URL = "https://goforaibusiness.netlify.app"
  FLASK_DEBUG = "false"
  NETLIFY = "true"

[context.deploy-preview.environment]
  SITE_BASE_URL = "https://goforaibusiness.netlify.app"
  PUBLIC_URL = "https://goforaibusiness.netlify.app"
  FLASK_DEBUG = "false"
  NETLIFY = "true"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/downloads/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200